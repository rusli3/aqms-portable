services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: partikulat
      MYSQL_USER: aqms
      MYSQL_PASSWORD: aqms-test-only
      MYSQL_ROOT_PASSWORD: aqms-root-test-only
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  web:
    build: .
    environment:
      AQMS_DB_HOST: database
      AQMS_DB_USER: aqms
      AQMS_DB_PASSWORD: aqms-test-only
      AQMS_DB_NAME: partikulat
      AQMS_DISPLAY_NAME: PARTIKULAT 02 — UJI MIGRASI
      AQMS_TIMEZONE: Asia/Jakarta
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
