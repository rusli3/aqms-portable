services:
  database:
    environment:
      MYSQL_DATABASE: ${AQMS_DB_NAME:?set AQMS_DB_NAME in .env}
      MYSQL_USER: ${AQMS_DB_USER:?set AQMS_DB_USER in .env}
      MYSQL_PASSWORD: ${AQMS_DB_PASSWORD:?set AQMS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${AQMS_DB_ROOT_PASSWORD:?set AQMS_DB_ROOT_PASSWORD in .env}

  web:
    environment:
      AQMS_DB_USER: ${AQMS_DB_USER:?set AQMS_DB_USER in .env}
      AQMS_DB_PASSWORD: ${AQMS_DB_PASSWORD:?set AQMS_DB_PASSWORD in .env}
      AQMS_DB_NAME: ${AQMS_DB_NAME:?set AQMS_DB_NAME in .env}
      AQMS_INGEST_ALLOWED_CIDRS: ${AQMS_INGEST_ALLOWED_CIDRS:?set sensor IP or CIDR in .env}
      AQMS_POWER_CONTROLS_ENABLED: ${AQMS_POWER_CONTROLS_ENABLED:-false}
      AQMS_ADMIN_PIN_HASH: ${AQMS_ADMIN_PIN_HASH:-}
      AQMS_WIFI_SSID: ${AQMS_WIFI_SSID:-PARTIKULAT02}
      AQMS_WIFI_PSK: ${AQMS_WIFI_PSK:-}
      AQMS_WIFI_HIDDEN: ${AQMS_WIFI_HIDDEN:-false}
      AQMS_DATA_URL: ${AQMS_DATA_URL:-http://192.168.100.135/display/}
    volumes:
      - ${AQMS_CONTROL_DIR:-/run/aqms-control}:/run/aqms-control
  scheduler:
    environment:
      AQMS_DB_USER: ${AQMS_DB_USER:?set AQMS_DB_USER in .env}
      AQMS_DB_PASSWORD: ${AQMS_DB_PASSWORD:?set AQMS_DB_PASSWORD in .env}
      AQMS_DB_NAME: ${AQMS_DB_NAME:?set AQMS_DB_NAME in .env}
